# Example nginx site for webmention.io with php-fpm.

# API tokens travel in the query string (?token=), so they are blanked before
# the request line reaches the access log.
map $request_uri $redacted_uri {
    ~^(?<before>.*[?&](?:access_)?token=)[^&]*(?<after>.*)$ "${before}REDACTED${after}";
    default $request_uri;
}
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $redacted_uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

# The app rate-limits webmentions per client and per source host itself; this
# is the backstop that keeps a flood from reaching PHP at all.
limit_req_zone $binary_remote_addr zone=webmention:10m rate=10r/s;

server {
    listen 80;
    server_name webmention.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name webmention.io;

    root /web/sites/webmention.io/public;
    index index.php;

    # ssl_certificate     ...;
    # ssl_certificate_key ...;

    server_tokens off;
    access_log /var/log/nginx/webmention.io.access.log redacted;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Webmentions and settings forms are small.
    client_max_body_size 64k;

    limit_req zone=webmention burst=50 nodelay;
    limit_req_status 429;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # Nothing else under public/ is PHP, and nothing starting with a dot is
    # meant to be served. (The document root holds no such files today; this
    # keeps it that way if a stray file ever lands there.)
    location ~ \.php$ { return 404; }
    location ~ /\.    { deny all; }

    # Static assets change rarely; mentions.js is embedded by other sites.
    location ~* \.(css|js|png|svg|ico)$ {
        expires 1d;
        try_files $uri =404;
    }
}
