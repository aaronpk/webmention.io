# Example nginx site for webmention.io with php-fpm.

# API tokens travel in the query string (?token=), so they are blanked before
# the request line reaches the access log.
map $request_uri $redacted_uri {
    ~^(?<before>.*[?&](?:access_)?token=)[^&]*(?<after>.*)$ "${before}REDACTED${after}";
    default $request_uri;
}
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $redacted_uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

# When another server proxies to this one, take the client address from
# X-Forwarded-For, but only when the request comes from that proxy. Without
# this every visitor shares one rate-limit bucket here, and the app's own
# per-client limits (webmentions, ?debug, sign-in) collapse onto the proxy's
# address too. PHP then sees the real address in REMOTE_ADDR, so TRUST_PROXY
# stays 0 in .env.
set_real_ip_from 203.0.113.10;   # the proxy's address
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The app rate-limits webmentions per client and per source host itself; this
# is the backstop that keeps a flood from reaching PHP at all. It applies to
# PHP requests only (see the index.php location): static files never count,
# so a page load's CSS, JS and images can't trip it. 20/s with a burst of 40
# is far above what a browser does and well below a flood.
limit_req_zone $binary_remote_addr zone=webmention:10m rate=20r/s;
limit_req_log_level warn;
limit_req_status 429;

server {
    listen 80;
    server_name webmention.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name webmention.io;

    root /web/sites/webmention.io/public;
    index index.php;

    # ssl_certificate     ...;
    # ssl_certificate_key ...;

    server_tokens off;
    access_log /var/log/nginx/webmention.io.access.log redacted;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Webmentions and settings forms are small.
    client_max_body_size 64k;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        limit_req zone=webmention burst=40 nodelay;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # The visitor is on HTTPS even when TLS ends at a proxy in front of
        # this server, so this stays on either way.
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # Nothing else under public/ is PHP, and nothing starting with a dot is
    # meant to be served. (The document root holds no such files today; this
    # keeps it that way if a stray file ever lands there.)
    location ~ \.php$ { return 404; }
    location ~ /\.    { deny all; }

    # Static assets change rarely; mentions.js is embedded by other sites.
    location ~* \.(css|js|png|svg|ico)$ {
        expires 1d;
        try_files $uri =404;
    }
}
